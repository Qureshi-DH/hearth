apiVersion: v1
kind: Service
metadata:
  name: hearth
spec:
  selector:
    app.kubernetes.io/name: hearth-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hearth-api
spec:
  replicas: 1
  # Without Redis, realtime events reach only the websockets on the pod that
  # sent them, so an old and a new pod side by side would split the family.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hearth-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hearth-api
    spec:
      containers:
        - name: api
          image: dhqureshi/hearth-api
          envFrom:
            - secretRef:
                name: hearth
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "4000"
            - name: MIGRATE_ON_START
              value: "true"
            - name: TRUST_PROXY
              value: "true"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hearth
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgres://hearth:$(POSTGRES_PASSWORD)@postgres:5432/hearth
          ports:
            - name: http
              containerPort: 4000
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 512Mi
