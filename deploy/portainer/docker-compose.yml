# Hearth as a Portainer stack, or anywhere else that hands the variables to
# Compose directly rather than through a .env file beside it. In Portainer:
# Stacks, Add stack, Repository, this repository with this file as the
# compose path, then the variables below under Environment variables.
# templates.json beside it offers the same thing as an App Template.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hearth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: hearth
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hearth -d hearth"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ${HEARTH_IMAGE:-dhqureshi/hearth-api:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://hearth:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/hearth
      MIGRATE_ON_START: "true"
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-invite}
      PUSH_PROVIDER: ${PUSH_PROVIDER:-none}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      NTFY_BASE_URL: ${NTFY_BASE_URL:-}
    ports:
      # Loopback unless HEARTH_BIND says otherwise. Docker's port rules go
      # around ufw and firewalld.
      - "${HEARTH_BIND:-127.0.0.1}:${HEARTH_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/readyz"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  postgres-data:
