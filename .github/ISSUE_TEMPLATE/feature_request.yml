name: Feature request
description: Suggest something Hearth should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: Describe the situation, not the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you would like to happen

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      description: Hearth exists so families keep their own data.
      options:
        - label: This does not require sending location data to a third party
