version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
      expo:
        patterns: ["expo", "expo-*", "@expo/*", "react-native*"]

  # The docs site is installed on its own, outside the pnpm workspace, so the
  # entry above never reaches its lockfile.
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: monthly
