name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    # Every job is capped. A test run that never exits otherwise holds a
    # runner for the six hour default, on a private repository's minutes.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "10.14.0" }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prettier
        run: pnpm exec prettier --check .
      - name: ESLint
        run: pnpm lint
      - name: Markdown
        run: pnpm exec markdownlint-cli2
      - name: Commit messages
        if: github.event_name == 'pull_request'
        run: >
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

  docs:
    name: Documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "10.14.0" }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        working-directory: docs
        run: pnpm install --frozen-lockfile --ignore-workspace
      - name: Build
        working-directory: docs
        # onBrokenLinks is "throw", so this fails on a stale internal link
        # rather than shipping one.
        run: pnpm build

  server:
    name: Server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hearth
          POSTGRES_PASSWORD: hearth
          POSTGRES_DB: hearth_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hearth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "10.14.0" }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: |
          pnpm --filter @hearth/shared typecheck
          pnpm --filter @hearth/server typecheck
      - name: Shared tests
        run: pnpm --filter @hearth/shared test
      - name: Server tests
        env:
          TEST_DATABASE_URL: postgres://hearth:hearth@localhost:5432/hearth_test
        run: pnpm --filter @hearth/server test
      - name: Build
        run: pnpm --filter @hearth/server build
      - name: Migrations are up to date
        run: |
          pnpm --filter @hearth/server exec drizzle-kit generate
          if ! git diff --quiet -- server/src/db/migrations; then
            echo "Schema changed without a generated migration. Run pnpm db:generate."
            git diff --stat -- server/src/db/migrations
            exit 1
          fi

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "10.14.0" }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter hearth-mobile typecheck
      - name: Tests
        run: pnpm --filter hearth-mobile exec jest --ci
      - name: Expo config resolves
        run: pnpm --filter hearth-mobile exec expo config --type introspect > /dev/null

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [server]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: false
          tags: hearth-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
