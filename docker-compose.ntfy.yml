# Optional overlay: a self-hosted ntfy server for fully self-contained push.
#
#   docker compose -f docker-compose.yml -f docker-compose.ntfy.yml up -d
#
# Then set in .env:
#   PUSH_PROVIDER=ntfy
#   NTFY_BASE_URL=https://ntfy.your-domain.example   # what phones will reach
#
# The api container talks to ntfy over the internal network as http://ntfy:80,
# so NTFY_INTERNAL_URL below overrides NTFY_BASE_URL for server->ntfy calls.
# See docs/docs/install/push-notifications.md.

services:
  ntfy:
    image: binwiederhier/ntfy:latest
    restart: unless-stopped
    command: serve
    environment:
      NTFY_BASE_URL: ${NTFY_BASE_URL:-http://localhost:8093}
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_AUTH_FILE: /var/lib/ntfy/user.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_BEHIND_PROXY: "true"
      NTFY_ENABLE_LOGIN: "true"
    volumes:
      - ntfy-cache:/var/cache/ntfy
      - ntfy-data:/var/lib/ntfy
    ports:
      - "${NTFY_PORT:-8093}:80"

  api:
    depends_on:
      ntfy:
        condition: service_started
    environment:
      NTFY_INTERNAL_URL: http://ntfy:80

volumes:
  ntfy-cache:
  ntfy-data:
